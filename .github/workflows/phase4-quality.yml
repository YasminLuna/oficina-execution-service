name: Execution Phase 4 - quality
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/fase4-service]
  push:
    branches: [feature/fase4-service]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.13.0
      - name: Critical static analysis
        run: ruff check --select E4,E7,E9,F app tests
      - name: Unit tests and coverage threshold
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Build image
        run: docker build -t oficina-execution-service:ci .
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-coverage
          path: coverage.xml
          if-no-files-found: ignore
